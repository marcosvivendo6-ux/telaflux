<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d"><title>NEXXORA — Buscar</title>
<style>
:root{--bg:#07080d;--panel:#11131b;--text:#f5f3ed;--muted:#9da1ad;--gold:#d9b86c;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(217,184,108,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}
.top{height:62px;position:sticky;top:0;z-index:20;display:flex;align-items:center;padding:0 16px;background:rgba(7,8,13,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{margin:auto;font-weight:900;letter-spacing:.16em}.logo span{color:var(--gold)}
main{max-width:1180px;margin:auto;padding:28px 16px 100px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,54px);line-height:1;margin:8px 0 18px;letter-spacing:-.04em}
.search{display:flex;gap:8px}.search input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;background:var(--panel);color:var(--text);padding:14px;font-size:14px;outline:none}.search input:focus{border-color:rgba(217,184,108,.65)}.search button{border:0;border-radius:13px;background:var(--gold);color:#111;font-weight:900;padding:0 17px}
.heading{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.heading h2{font-size:20px;margin:0}.count{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;cursor:pointer}.poster{height:245px;border-radius:15px;overflow:hidden;background:#151822;border:1px solid var(--line)}.poster img{width:100%;height:100%;object-fit:cover;display:block}.card h3{font-size:14px;line-height:1.25;margin:9px 2px 3px}.card p{font-size:11px;color:var(--muted);margin:0 2px}.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 8px;line-height:1.6}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(8,9,14,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottom-inner{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.bottom a{text-align:center;color:#8f93a0;font-size:10px;padding:4px}.bottom a strong{display:block;font-size:17px;font-weight:500;margin-bottom:3px}.bottom a.active{color:var(--gold)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.poster{height:330px}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.poster{height:360px}}
</style></head>
<body>
<header class="top"><div class="logo">NEXX<span>O</span>RA</div></header>
<main>
<div class="eyebrow">Explorar</div><h1>Encontre seu próximo filme.</h1>
<form class="search" id="form"><input id="q" placeholder="Buscar filmes e séries..." autocomplete="off"><button>Buscar</button></form>
<div class="heading"><h2 id="title">Pesquise no catálogo</h2><span class="count" id="count"></span></div>
<section class="grid" id="grid"><div class="empty">Digite um título, personagem ou termo para começar.</div></section>
</main>
<div style="text-align:center;color:#666b77;font-size:9px;padding:18px 14px 90px">Dados e imagens: TMDB. Este produto usa a API do TMDB, mas não é endossado ou certificado pelo TMDB.</div>
<nav class="bottom"><div class="bottom-inner"><a href="index.html"><strong>⌂</strong>Início</a><a href="cinema.html"><strong>🎬</strong>Cinema</a><a href="streaming.html"><strong>▣</strong>Streaming</a><a class="active" href="buscar.html"><strong>⌕</strong>Buscar</a><a href="minha-lista.html"><strong>♡</strong>Minha Lista</a></div></nav>
<script>
const API="https://telaflux-api.onrender.com/api";const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750"><rect width="100%" height="100%" fill="#171a23"/><text x="50%" y="50%" fill="#9da1ad" text-anchor="middle" font-family="Arial" font-size="28">NEXXORA</text></svg>');
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function card(x){let type=x.type==="tv"||x.media_type==="tv"?"tv":"movie";let title=x.title||x.name||"Sem título";return `<article class="card" onclick="location.href='detalhes.html?type=${type}&id=${Number(x.id)}'"><div class="poster"><img loading="lazy" src="${esc(x.img||fallback)}" onerror="this.src='${fallback}'"></div><h3>${esc(title)}</h3><p>${esc(x.date||x.releaseDate||"Data não informada")}</p></article>`}
async function search(q){q=q.trim();if(!q)return;document.getElementById("title").textContent="Resultados para “"+q+"”";document.getElementById("grid").innerHTML='<div class="empty">Buscando...</div>';try{let r=await fetch(API+"/search?q="+encodeURIComponent(q));if(!r.ok)throw Error();let d=await r.json(),items=d.results||[];document.getElementById("count").textContent=items.length+" resultado"+(items.length===1?"":"s");document.getElementById("grid").innerHTML=items.length?items.map(card).join(""):'<div class="empty">Nenhum resultado encontrado.</div>'}catch(e){document.getElementById("grid").innerHTML='<div class="empty">Não foi possível realizar a busca agora.</div>'}}
document.getElementById("form").onsubmit=e=>{e.preventDefault();search(document.getElementById("q").value)};let initial=new URLSearchParams(location.search).get("q");if(initial){document.getElementById("q").value=initial;search(initial)}
</script></body></html>
