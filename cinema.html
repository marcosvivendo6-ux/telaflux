<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="description" content="NEXXORA — próximas estreias nos cinemas.">
<title>NEXXORA — Cinema</title>
<style>
:root{--bg:#07080d;--panel:#11131b;--text:#f5f3ed;--muted:#9da1ad;--gold:#d9b86c;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(217,184,108,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}
.top{position:sticky;top:0;z-index:20;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(7,8,13,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.logo{font-weight:900;letter-spacing:.16em}.logo span{color:var(--gold)}.back{width:40px;height:40px;border:0;border-radius:50%;background:var(--panel);color:var(--text);font-size:20px}
main{max-width:1180px;margin:auto;padding:28px 16px 100px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
h1{font-size:clamp(34px,7vw,58px);line-height:.96;letter-spacing:-.04em;margin:9px 0 12px}.intro{color:var(--muted);line-height:1.6;font-size:14px;max-width:650px}
.month{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.month h2{font-size:20px;margin:0}.count{color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{min-width:0;cursor:pointer}.poster{position:relative;height:245px;border-radius:15px;overflow:hidden;background:#151822;border:1px solid var(--line);box-shadow:0 12px 28px rgba(0,0,0,.24)}.poster img{width:100%;height:100%;object-fit:cover;display:block}.date{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px 8px;font-size:10px;font-weight:800}.card h3{font-size:14px;line-height:1.25;margin:9px 2px 3px}.card p{font-size:11px;color:var(--muted);margin:0 2px;line-height:1.45}
.loading{height:245px;border-radius:15px;background:linear-gradient(110deg,#11131a 20%,#1c202a 40%,#11131a 60%);background-size:200% 100%;animation:l 1.4s infinite}@keyframes l{to{background-position:-200% 0}}
.empty{grid-column:1/-1;color:var(--muted);padding:35px 5px;text-align:center}.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(8,9,14,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottom-inner{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.bottom a{text-align:center;color:#8f93a0;font-size:10px;padding:4px}.bottom a strong{display:block;font-size:17px;font-weight:500;margin-bottom:3px}.bottom a.active,.bottom a:hover{color:var(--gold)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.poster{height:330px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.poster{height:360px}}
</style>
</head>
<body>
<header class="top"><button class="back" onclick="history.back()">‹</button><div class="logo">NEXX<span>O</span>RA</div><div style="width:40px"></div></header>
<main>
  <div class="eyebrow">Cinema</div>
  <h1>O que chega às telonas.</h1>
  <p class="intro">Acompanhe os filmes com lançamento cinematográfico previsto para este mês no Brasil.</p>
  <div class="month"><h2 id="monthTitle">Estreias deste mês</h2><span class="count" id="count"></span></div>
  <section class="grid" id="grid"><div class="card"><div class="loading"></div></div><div class="card"><div class="loading"></div></div><div class="card"><div class="loading"></div></div><div class="card"><div class="loading"></div></div></section>
</main>
<div style="text-align:center;color:#666b77;font-size:9px;padding:18px 14px 90px">Dados e imagens: TMDB. Este produto usa a API do TMDB, mas não é endossado ou certificado pelo TMDB.</div>
<nav class="bottom"><div class="bottom-inner">
<a href="index.html"><strong>⌂</strong>Início</a><a class="active" href="cinema.html"><strong>🎬</strong>Cinema</a><a href="streaming.html"><strong>▣</strong>Streaming</a><a href="buscar.html"><strong>⌕</strong>Buscar</a><a href="minha-lista.html"><strong>♡</strong>Minha Lista</a>
</div></nav>
<script>
const API="https://telaflux-api.onrender.com/api";
const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750"><rect width="100%" height="100%" fill="#171a23"/><text x="50%" y="50%" fill="#9da1ad" text-anchor="middle" font-family="Arial" font-size="28">NEXXORA</text></svg>');
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function formatDate(v){if(!v)return"Data a confirmar";const d=new Date(v+"T12:00:00");return Number.isNaN(d.getTime())?"Data a confirmar":d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","")}
function card(x){const title=x.title||x.name||"Sem título";const poster=x.img||fallback;return `<article class="card" onclick="location.href='detalhes.html?type=movie&id=${Number(x.id)}'"><div class="poster"><img loading="lazy" src="${esc(poster)}" onerror="this.src='${fallback}'"><span class="date">${esc(formatDate(x.releaseDate||x.date))}</span></div><h3>${esc(title)}</h3><p>${esc(x.desc||"Filme com lançamento previsto nos cinemas.")}</p></article>`}
async function load(){try{const r=await fetch(API+"/cinema-month");if(!r.ok)throw Error();const d=await r.json();const items=d.results||[];document.getElementById("count").textContent=`${items.length} título${items.length===1?"":"s"}`;if(d.month){const [y,m]=d.month.split("-");const name=new Date(Number(y),Number(m)-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});document.getElementById("monthTitle").textContent="Estreias de "+name.charAt(0).toUpperCase()+name.slice(1)}document.getElementById("grid").innerHTML=items.length?items.map(card).join(""):'<div class="empty">Nenhuma estreia cinematográfica encontrada para este mês.</div>'}catch(e){document.getElementById("grid").innerHTML='<div class="empty">Não foi possível carregar as estreias. Tente novamente em instantes.</div>'}}
load();
</script>
</body>
</html>
