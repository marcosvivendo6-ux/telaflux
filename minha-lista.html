<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080d">
<title>NEXXORA — Minha Lista</title>
<style>
:root{--bg:#07080d;--panel:#11131b;--text:#f5f3ed;--muted:#9da1ad;--gold:#d9b86c;--line:rgba(255,255,255,.09)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,rgba(217,184,108,.12),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}
.top{height:62px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(7,8,13,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{font-weight:900;letter-spacing:.16em}.logo span{color:var(--gold)}
main{max-width:1180px;margin:auto;padding:28px 16px 100px}.eyebrow{color:var(--gold);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,54px);line-height:1;margin:8px 0 12px;letter-spacing:-.04em}.intro{color:var(--muted);font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:24px}.card{min-width:0}.poster{height:245px;border-radius:15px;overflow:hidden;background:#151822;border:1px solid var(--line);position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.remove{position:absolute;right:8px;top:8px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(0,0,0,.8);color:white;font-size:17px}.card h3{font-size:14px;margin:9px 2px 3px}.card p{font-size:11px;color:var(--muted);margin:0 2px}.empty{color:var(--muted);text-align:center;padding:50px 10px;line-height:1.7}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(8,9,14,.95);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom))}.bottom-inner{max-width:650px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.bottom a{text-align:center;color:#8f93a0;font-size:10px;padding:4px}.bottom a strong{display:block;font-size:17px;font-weight:500;margin-bottom:3px}.bottom a.active{color:var(--gold)}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.poster{height:330px}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.poster{height:360px}}
</style></head>
<body>
<header class="top"><div class="logo">NEXX<span>O</span>RA</div></header>
<main><div class="eyebrow">Sua seleção</div><h1>Minha Lista.</h1><p class="intro">Guarde filmes e séries para encontrar depois. Sua lista fica salva neste dispositivo.</p><section class="grid" id="grid"></section></main>
<div style="text-align:center;color:#666b77;font-size:9px;padding:18px 14px 90px">Dados e imagens: TMDB. Este produto usa a API do TMDB, mas não é endossado ou certificado pelo TMDB.</div>
<nav class="bottom"><div class="bottom-inner"><a href="index.html"><strong>⌂</strong>Início</a><a href="cinema.html"><strong>🎬</strong>Cinema</a><a href="streaming.html"><strong>▣</strong>Streaming</a><a href="buscar.html"><strong>⌕</strong>Buscar</a><a class="active" href="minha-lista.html"><strong>♡</strong>Minha Lista</a></div></nav>
<script>
const KEY="nexxora-list";const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750"><rect width="100%" height="100%" fill="#171a23"/><text x="50%" y="50%" fill="#9da1ad" text-anchor="middle" font-family="Arial" font-size="28">NEXXORA</text></svg>');
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x))}
function render(){let items=get(),grid=document.getElementById("grid");if(!items.length){grid.innerHTML='<div class="empty">Sua lista ainda está vazia.<br>Abra um filme ou série e toque em “Minha Lista”.</div>';return}grid.innerHTML=items.map(x=>`<article class="card"><div class="poster"><img src="${esc(x.poster?"https://image.tmdb.org/t/p/w500"+x.poster:x.img||fallback)}" onerror="this.src='${fallback}'"><button class="remove" onclick="removeItem('${esc(x.type)}',${Number(x.id)})">×</button></div><h3 onclick="location.href='detalhes.html?type=${esc(x.type)}&id=${Number(x.id)}'">${esc(x.title)}</h3><p>${x.type==="tv"?"Série":"Filme"}</p></article>`).join("")}
function removeItem(type,id){save(get().filter(x=>!(x.type===type&&Number(x.id)===Number(id))));render()}
render();
</script></body></html>
